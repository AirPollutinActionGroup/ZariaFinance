spring.application.name=finance

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=${PORT:5174}
spring.mvc.servlet.load-on-startup=1

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
logging.level.org.springframework.security=DEBUG

# RBI reference-rate feed for the grant form's FX rate. Disabled by default: the
# RBI publishes no stable public JSON contract, so point `url` at the feed your
# finance team signs against ({currency} and {date} are substituted) and name the
# JSON field holding the rate. While disabled, lookups serve cached fx_rate rows.
zaria.fx.rbi.enabled=${ZARIA_FX_RBI_ENABLED:false}
zaria.fx.rbi.url=${ZARIA_FX_RBI_URL:}
zaria.fx.rbi.rate-field=${ZARIA_FX_RBI_RATE_FIELD:rate}

# Daily reminder sweep for disbursement release criteria. The sweep deduplicates
# on a unique key, so a missed, repeated or concurrent run cannot double-notify.
zaria.reminders.enabled=${ZARIA_REMINDERS_ENABLED:true}
zaria.reminders.cron=${ZARIA_REMINDERS_CRON:0 0 1 * * *}